# render.yaml — Render Infrastructure-as-Code
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys as a Web Service using `serve` to host the Vite dist/ folder.
# Every push to `main` triggers an automatic rebuild and redeploy.

services:
  - type: web
    name: global-battery-waste-tracker
    runtime: node
    region: singapore   # closest to India — change if needed

    # ── Source ──────────────────────────────────────────────────────────────
    repo: https://github.com/sujithr-z/GLOBAL-BATTERY-WASTE-TRACKER
    branch: main

    # ── Build & Start ───────────────────────────────────────────────────────
    buildCommand: npm ci && npm run build
    startCommand: npm start          # runs: serve -s dist -l $PORT

    # ── Instance ────────────────────────────────────────────────────────────
    plan: free                       # free tier (512 MB RAM, shared CPU)

    # ── Environment ─────────────────────────────────────────────────────────
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
